when:
  - event: push
    branch: main

steps:
  - name: format
    image: ziglings/ziglang
    commands:
      - echo "Formatting code"
      - zig fmt .

  - name: build
    image: ziglings/ziglang
    commands:
      - echo "Starting build"
      - zig build

  - name: test
    image: ziglings/ziglang
    commands:
      - echo "Running tests"
      - zig build test
